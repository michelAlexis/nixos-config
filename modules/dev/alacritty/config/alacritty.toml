# =============================================================================
# Alacritty
# =============================================================================

[general]
import = [
    "~/.config/alacritty/catppuccin-frappe.toml"
]

# =============================================================================
# Environment
# =============================================================================

[env]
TERM = "xterm-256color"

# =============================================================================
# Window
# =============================================================================

[window]
padding = { x = 4, y = 3 }
# dynamic_padding = true
decorations = "Full"
opacity = 1.0
startup_mode = "Maximized"

# =============================================================================
# Font
# =============================================================================

[font]
size = 11
glyph_offset = { x = 0, y = 0 }

[font.offset]
y = 0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

# =============================================================================
# Cursor
# =============================================================================

[cursor]
# style = { shape = "Beam", blinking = "On" }

# =============================================================================
# Scrolling
# =============================================================================

[scrolling]
history = 10000
multiplier = 3

# =============================================================================
# Selection
# =============================================================================

[selection]
save_to_clipboard = true

# =============================================================================
# Shell
# =============================================================================

[terminal.shell]
program = "bash"

# =============================================================================
# Mouse
# =============================================================================

[mouse]
hide_when_typing = true
